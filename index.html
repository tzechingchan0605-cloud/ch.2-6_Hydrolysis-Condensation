function buildChainDiagram(svg,count,withMaltase){
 const sp=mobile?62:72,radius=mobile?22:25;
 const bonds=Array.from({length:count-1},(_,i)=>`<line id="zBond${i}" class="bond" data-bond-index="${i}"/>`).join('');
 const nodes=Array.from({length:count},(_,i)=>node('glucose',`zNode${i}`,0,0,radius/31)).join('');
 const events=withMaltase?zoomEvents:[1,3].map((bond,i)=>({id:`release${i}`,bond,start:.7+i*5.2,dock:2+i*5.2,cut:4+i*5.2,end:5.2+i*5.2,enzyme:'amylase'}));
 const waters=events.map(e=>`<g id="zReaction${e.id}" data-cleaved="false"><circle id="zTarget${e.id}" r="19" class="bond-target"/><path id="zPath${e.id}" class="water-path"/>${water(`zWater${e.id}`)}</g>`).join('');
 svg.insertAdjacentHTML('beforeend',`<g id="zoomMoleculeWorld" class="zoom-world">${enzymePocket('zBeta','amylase',sp/2,radius)}${withMaltase?enzymePocket('zMaltase','maltase',sp/2,radius):''}<g id="zBonds">${bonds}</g><g id="zNodes">${nodes}</g>${waters}<text id="zChainName" class="zoom-molecule-label" text-anchor="middle"></text>${Array.from({length:count/2},(_,i)=>`<text id="zPairName${i}" class="zoom-molecule-label" text-anchor="middle"></text>`).join('')}<text x="${mobile?310:530}" y="38" class="zoom-ribbon" text-anchor="middle" data-t="zoomRibbon1"></text>${withMaltase?`<text x="${mobile?310:530}" y="74" class="zoom-ribbon" text-anchor="middle" data-t="zoomRibbon2"></text>`:''}<title data-t="moleculeExample"></title></g>`);
 cache.zoom={count,withMaltase,spacing:sp,radius,nodes:Array.from({length:count},(_,i)=>$(`zNode${i}`)),bonds:Array.from({length:count-1},(_,i)=>$(`zBond${i}`)),events:events.map(e=>({...e,group:$(`zReaction${e.id}`),target:$(`zTarget${e.id}`),path:$(`zPath${e.id}`),water:$(`zWater${e.id}`)}))};
}

function zoomMoleculeSnapshot(sec){
 const z=cache.zoom,sp=z.spacing,n=z.count,withMaltase=z.withMaltase;
 const releases=z.events.filter(e=>e.enzyme==='amylase'),malts=z.events.filter(e=>e.enzyme==='maltase');
 const site=[mobile?210:270,mobile?235:175],lower=[mobile?310:530,mobile?580:350];
 const initialX=site[0]-1.5*sp,initialY=site[1]-55;
 const released=releases.filter(e=>sec>=e.cut).length;
 const current=releases.find(e=>sec<e.end)||releases.at(-1);
 const dock=part(sec,current.start,current.dock),leave=part(sec,current.cut,current.end);
 const index=releases.indexOf(current);
 // Shift the remaining chain by one maltose pair for each reuse of the same enzyme.
 const offset=2*sp*(index+leave);
 const chainY=mix(initialY,site[1],dock)*(1-leave)+initialY*leave;
 const positions=Array.from({length:n},(_,i)=>[initialX+i*sp-offset,chainY]);
 const categories=Array(n).fill('starch');
 const rowXs=mobile?[110,250,390,530]:[180,410,640,870];
 const rowY=mobile?(withMaltase?435:520):(withMaltase?285:390);
 for(let pair=0;pair<n/2;pair++){
  const release=releases[Math.min(pair,releases.length-1)];
  const freed=pair<released||(pair===n/2-1&&released===releases.length);
  const malt=malts[pair],split=!!malt&&sec>=malt.cut;
  if(freed){
   const out=part(sec,release.cut,release.end),inlet=malt?part(sec,malt.start,malt.dock):0,exit=malt?part(sec,malt.cut,malt.end):0;
   for(let j=0;j<2;j++){
    const id=pair*2+j,sourceX=initialX+(id-2*Math.min(pair,releases.length-1))*sp;
    const park=[rowXs[pair]+(j-.5)*sp,rowY];
    let pos=[mix(sourceX,park[0],out),mix(site[1],park[1],out)];
    if(malt&&sec>=malt.start)pos=[mix(park[0],lower[0]+(j-.5)*sp,inlet),mix(park[1],lower[1],inlet)];
    if(split){const finalX=mobile?rowXs[pair]+(j-.5)*76:rowXs[pair]+(j-.5)*96;pos=[mix(lower[0]+(j-.5)*sp,finalX,exit),mix(lower[1],mobile?780:475,exit)];}
    positions[id]=pos;categories[id]=split?'glucose':'maltose';
   }
  }
  const label=$(`zPairName${pair}`),a=positions[pair*2],b=positions[pair*2+1];
  visible(label,freed&&(!malt||sec<malt.start||sec>=malt.end));
  attr(label,'x',(a[0]+b[0])/2);attr(label,'y',(a[1]+b[1])/2+48);
  text(`zPairName${pair}`,t(split?'glucose':'maltose'));
 }
 const cleaved=z.events.filter(e=>sec>=e.cut).map(e=>e.bond);
 z.nodes.forEach((el,i)=>{attr(el,'transform',`translate(${positions[i][0]} ${positions[i][1]}) scale(${z.radius/31})`);attr(el,'data-product',categories[i]);});
 z.bonds.forEach((el,i)=>{attr(el,'x1',positions[i][0]);attr(el,'y1',positions[i][1]);attr(el,'x2',positions[i+1][0]);attr(el,'y2',positions[i+1][1]);visible(el,!cleaved.includes(i));attr(el,'data-cleaved',cleaved.includes(i));attr(el,'class',`bond ${z.events.some(e=>e.bond===i&&sec>=e.start&&sec<e.cut)?'target-bond':''}`);});
 const amylaseX=mix(site[0]-30,site[0],dock)-30*leave,amylaseY=mix(site[1]+60,site[1],dock)-65*leave;
 attr($('zBeta'),'transform',`translate(${amylaseX} ${amylaseY})`);
 if(withMaltase){
  const e=malts.find(e=>sec<e.end)||malts.at(-1),approach=part(sec,e.start,e.dock),exit=part(sec,e.cut,e.end);
  attr($('zMaltase'),'transform',`translate(${lower[0]} ${lower[1]})`);
 }
 z.events.forEach(e=>{
  const a=positions[e.bond],b=positions[e.bond+1],target=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const source=e.enzyme==='amylase'?[mobile?490:720,110]:[mobile?540:920,mobile?550:330];
  const amount=part(sec,e.dock,e.cut);
  visible(e.group,sec>=e.start&&sec<e.cut);attr(e.group,'data-cleaved',sec>=e.cut);attr(e.group,'data-bound',sec>=e.dock&&sec<e.cut);attr(e.water,'data-consumed',sec>=e.cut);
  attr(e.water,'transform',`translate(${mix(source[0],target[0],amount)} ${mix(source[1],target[1]-25,amount)})`);
  visible(e.path,sec>=e.dock&&sec<e.cut);attr(e.path,'d',`M${source[0]} ${source[1]+15}L${target[0]} ${target[1]}`);attr(e.target,'cx',target[0]);attr(e.target,'cy',target[1]);
 });
 const rest=positions.filter((_,i)=>categories[i]==='starch');
 visible($('zChainName'),rest.length>0);text('zChainName',t('starch'));
 attr($('zChainName'),'x',rest.length?rest.reduce((s,p)=>s+p[0],0)/rest.length:site[0]);attr($('zChainName'),'y',chainY-45);
 attr($('zoomMoleculeWorld'),'data-cleavages',cleaved.length);attr($('zoomMoleculeWorld'),'data-waters-used',cleaved.length);
 return cleaved.length;
}
function zoomBananaSnapshot(sec){
 bananaSnapshot(clamp((sec-7)/21));
 const z=cache.zoom;
 const transitions=[[1.3,3.3],[4.3,6.3],[7,8.5],[26.4,28.4]];
 let level=0,active=-1,amount=0;
 for(let i=0;i<transitions.length;i++){
  const [a,b]=transitions[i];
  if(sec>=b)level=i+1;
  else if(sec>=a){active=i;amount=state.reduced?(sec>=(a+b)/2?1:0):smooth((sec-a)/(b-a));break;}
 }
 const targets=z.targets;
 attr($('granuleChainModel'),'opacity',part(sec,6.35,6.85));
 z.worlds.forEach((el,i)=>{
  let opacity=i===level?1:0,transform=i===4?(mobile?'translate(31 22) scale(.9)':'translate(0 30)'):'';
  if(active>=0){
   opacity=i===active?1-amount:i===active+1?amount:0;
   if(i===active){const [x,y]=targets[active],s=active===3?mix(1,.65,amount):mix(1,4.3,amount);transform=`translate(${x*(1-s)} ${y*(1-s)}) scale(${s})`;}
   else if(i===active+1&&i!==4){const cx=mobile?310:530,cy=mobile?440:280,s=mix(.72,1,amount);transform=`translate(${cx*(1-s)} ${cy*(1-s)}) scale(${s})`;}
  }
  visible(el,opacity>0);attr(el,'opacity',opacity);attr(el,'transform',transform);
 });
 const used=zoomMoleculeSnapshot(sec);
 const current=active>=0?(amount<.5?active:active+1):level;
 const key=current===4?'overview':['banana','cell','granule','molecules'][current];
 attr($('lesson'),'data-zoom-level',key);
 const waterEvent=zoomEvents.find(e=>sec>=e.dock&&sec<e.cut);
 let caption=current===0?'zoomIntro':current===1?'zoomCells':current===2?'zoomSurface':current===4?'zoomFinished':sec<10.4?'productive':waterEvent?(zoomEvents.filter(e=>sec>=e.dock&&sec<e.cut).length>1?'parallelHydrolysis':'complexWater'):sec<14?'releaseMaltose':sec<19.2?'parallelHydrolysis':sec<23.3?'complex':'maltoseSplit';
 text('stageCaption',t(caption));text('sceneEyebrow',t(current===3?'moleculeExample':current<2?'uploadedPhoto':'zoomScale'));
 text('phaseLabel',t(current===4?'ripe':['zoomBanana','zoomCell','zoomGranule','zoomMolecules'][current]));
 text('zoomCapacity',`${t('amylase')} → ${t('maltase')}`);
 text('ledger',current===3?`${t('bondsBroken')} ${used} · ${t('watersUsed')} ${used}`:t('notDataShort'));
 $('bananaStatus').hidden=current!==4;
 const time=$('storyTime');if(document.activeElement!==time)time.value=sec.toFixed(1);
 text('storyTimeLabel',`${sec.toFixed(1)} / 32 s`);attr(time,'aria-valuetext',`${sec.toFixed(1)} / 32 ${t('timeNotDays')}`);
 document.querySelectorAll('[data-zoom]').forEach((el,i)=>attr(el,'aria-pressed',i===Math.min(current,3)));
}

function applyText(){
  document.documentElement.lang=state.lang==='zh'?'zh-Hant':'en';document.title=t('title');
  document.querySelectorAll('[data-t]').forEach(el=>{const value=t(el.dataset.t);if(el.textContent!==value)el.textContent=value;});
  document.querySelectorAll('[data-aria]').forEach(el=>attr(el,'aria-label',t(el.dataset.aria)));
  attr($('zh'),'aria-pressed',state.lang==='zh');attr($('en'),'aria-pressed',state.lang==='en');
  text('fullscreenLabel',t(document.fullscreenElement?'exitFullscreen':'enterFullscreen'));
  text('diagramTitle',t(state.mode==='banana'?'diagramB':'diagramA'));text('diagramDescription',t(state.mode==='banana'?'diagramBDesc':'diagramADesc'));
}
function build(){
  if(state.mode==='banana')buildZoomBanana();else if(state.reaction==='starch')buildCompleteStarch();else buildHydrolysis();
  buildLegend();applyText();render();
}
function buildLegend(){
  $('legend').innerHTML=['glucose','fructose'].map(type=>`<span><svg viewBox="-36 -32 72 64" aria-hidden="true">${node(type,'')}</svg><span>${t(type)}</span></span>`).join('')+(state.mode==='banana'?`<span><svg viewBox="-60 -32 120 64" aria-hidden="true"><line x1="-25" x2="25" class="bond"/>${node('glucose','',-25,0,.75)}${node('fructose','',25,0,.75)}</svg><span>${t('sucrose')}</span></span>`:'')+`<span class="schematic">${t('schematic')}</span>`;
}
function equation(p){
  if(state.mode==='banana')return;
  const r=reactions[state.reaction],revealed=p>=.40;
  const key=[state.lang,state.reaction,revealed,state.enzymeVisible].join(':');
  if(key===equationKey)return;
  equationKey=key;
  const result=state.reaction==='starch'?t('maltose'):state.reaction==='maltose'?t('twoGlucose'):t('oneEach');
  const markup=`<span>${t(state.reaction)}</span><span>＋</span><span class="reactant-water">${t('water')}</span><span class="arrow"><span>${t(r.enzyme)}</span><svg viewBox="0 0 150 20" aria-hidden="true"><path d="M0 10h145m-12-8 12 8-12 8" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><span class="${revealed?'':'pending'}" data-equation-product>${revealed?result:t('unknownProduct')}</span><span class="equation-foot">${t(state.reaction==='starch'?'starchEquationNote':'equationNote')}</span>`;
  $('equation').innerHTML=markup;
}
function render(){
  const p=clamp(state.elapsed/duration()),banana=state.mode==='banana',done=p>=1;
  $('scene').classList.toggle('banana-scene',banana||state.reaction==='starch');
  $('projector').classList.toggle('banana-complete',banana&&done);
  $('reactionPicker').hidden=banana;$('equation').hidden=banana;$('bananaStatus').hidden=!banana;$('bananaNote').hidden=!banana;$('enzymeOption').hidden=true;
  $('review').hidden=!(banana&&done);$('summaryText').hidden=!state.summary;
  $('zoomChapters').hidden=!banana;$('storyTimebar').hidden=false;$('progress').hidden=true;
  $('storyTime').max=duration();text('zoomCapacity',banana?'':t(reactions[state.reaction].enzyme));
  document.querySelector('.timebar-ends').hidden=!banana;
  if(document.activeElement!==$('storyTime'))$('storyTime').value=state.elapsed.toFixed(1);
  text('storyTimeLabel',`${state.elapsed.toFixed(1)} / ${duration()} s`);
  text('showSummary',t(state.summary?'hideSummary':'showSummary'));
  $('playbackSpeed').value=String(state.speed);
  attr($('modeA'),'aria-pressed',!banana);attr($('modeB'),'aria-pressed',banana);
  document.querySelectorAll('button[data-reaction]').forEach(el=>attr(el,'aria-pressed',el.dataset.reaction===state.reaction));
  $('enzymeToggle').checked=state.enzymeVisible;$('motionToggle').checked=state.reduced;
  attr($('sequence'),'aria-pressed',state.sequence);text('sequenceLabel',t(state.sequence?'stopSequence':'sequence'));text('sequenceDuration',state.lang==='zh'?`約 ${(74/state.speed).toFixed(0)} 秒`:`About ${(74/state.speed).toFixed(0)} s`);
  text('playLabel',t(state.running?'pause':state.elapsed>0&&!done?'continue':done?'replay':'play'));
  const icon=state.running?'<path d="M7 4v16M17 4v16" stroke-width="4"/>':'<path d="m7 3 14 9-14 9V3Z" fill="currentColor" stroke="none"/>';
  if($('playIcon').dataset.playing!==String(state.running)){
    $('playIcon').innerHTML=icon;$('playIcon').dataset.playing=String(state.running);
  }
  $('progressFill').style.width=`${p*100}%`;attr($('progress'),'aria-valuenow',Math.round(p*100));
  text('progressLabel',state.sequence?`${t('sequenceProgress')} ${state.sequenceIndex+1} / 4`:t('manual'));
  if(banana){
    zoomBananaSnapshot(state.elapsed);
  }else{
    const used=state.reaction==='starch'?zoomMoleculeSnapshot(state.elapsed):hydrolysisSnapshot(p);
    const phase=p<.12?0:p<.26?1:p<.40?2:p<.55?3:p<.94?4:5;
    let caption=['contact','contact','waterAction','breakAction','reuse','finished'][phase];
    if(p>=.70&&p<.82)caption='secondWater';
    text('sceneEyebrow',t(state.reaction==='starch'?'simplified':'hydrolysisExample'));
    text('stageCaption',p<.12?`${t(reactions[state.reaction].enzyme)} · ${t('contact')}`:t(caption));text('phaseLabel',`${phase+1} / 6 · ${t(['before','catalysis','waterStage','productsStage','reuseStage','complete'][phase])}`);
    text('ledger',`${t('bondsBroken')} ${used} · ${t('watersUsed')} ${used}`);equation(p);
  }
  // Stable, language-neutral state for accessibility inspection and automated checks.
  Object.assign($('lesson').dataset,{mode:state.mode,reaction:state.reaction,elapsed:state.elapsed.toFixed(3),playing:String(state.running),sequence:String(state.sequence),reduced:String(state.reduced),speed:String(state.speed)});
}
function cancelFrame(){if(rafId!==null)cancelAnimationFrame(rafId);rafId=null;}
function setScene(item){state.mode=item==='banana'?'banana':'hydrolysis';if(item!=='banana')state.reaction=item;state.elapsed=0;state.summary=false;state.enzymeVisible=state.mode==='hydrolysis'&&state.running;build();}
function frame(now){
  rafId=null;if(!state.running)return;
  let remaining=(now-lastNow)/1000*state.speed;lastNow=now;
  while(remaining>0&&state.running){
    const step=Math.min(remaining,duration()-state.elapsed);state.elapsed+=step;remaining-=step;
    if(state.elapsed>=duration()){
      if(state.sequence&&state.sequenceIndex<3){state.sequenceIndex++;setScene(order[state.sequenceIndex]);}

function start(){

function pause(){state.running=false;cancelFrame();render();}
function select(item){pause();state.sequence=false;state.enzymeVisible=false;setScene(item);render();}
$('play').addEventListener('click',()=>state.running?pause():start());

$('modeA').addEventListener('click',()=>{if(state.mode!=='hydrolysis')select(state.reaction);});
$('modeB').addEventListener('click',()=>{if(state.mode!=='banana')select('banana');});
document.querySelectorAll('button[data-reaction]').forEach(el=>el.addEventListener('click',()=>select(el.dataset.reaction)));
$('sequence').addEventListener('click',()=>{

  pause();state.sequence=true;state.sequenceIndex=0;setScene('starch');start();

$('enzymeToggle').addEventListener('change',event=>{state.enzymeVisible=event.target.checked;render();});
$('motionToggle').addEventListener('change',event=>{state.reduced=event.target.checked;render();});
for(const lang of ['zh','en'])$(lang).addEventListener('click',()=>{state.lang=lang;applyText();buildLegend();render();});
$('showSummary').addEventListener('click',()=>{state.summary=!state.summary;render();});
$('fullscreen').addEventListener('click',async()=>{
  try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}
  catch{ $('statusMessage').hidden=false;text('statusMessage',t('fullscreenUnavailable')); }

document.addEventListener('fullscreenchange',()=>applyText());
const media=matchMedia('(max-width:639px)');media.addEventListener('change',event=>{mobile=event.matches;build();});
document.querySelectorAll('[data-zoom]').forEach(el=>el.addEventListener('click',()=>{
  pause();state.sequence=false;state.elapsed=Number(el.dataset.zoom);state.summary=false;render();
}));
$('playbackSpeed').addEventListener('change',event=>{
  const nextSpeed=Number(event.target.value);
  if(![.25,.5,1,1.25,1.5].includes(nextSpeed))return;
  // Finish the pending interval at the old speed, then apply the new rate.
  if(state.running){cancelFrame();frame(performance.now());}
  state.speed=nextSpeed;render();

$('storyTime').addEventListener('input',event=>{
  const value=Number(event.target.value);pause();state.sequence=false;state.elapsed=clamp(value,0,duration());state.summary=false;render();
});
window.addEventListener('pagehide',cancelFrame);
build();
})();
