    <g transform="${bananaTransform}"><path id="bananaPeel" d="M42 40Q105 173 231 16Q205 206 100 195Q34 173 42 40Z" fill="#8fa547" stroke="#5c722e" stroke-width="4"/><path d="M48 54Q106 193 225 32" fill="none" stroke="#fff5b0" stroke-width="7" opacity=".65"/><path d="m225 22 12-19m-195 39-7-15" stroke="#6c6338" stroke-width="12" stroke-linecap="round"/><g id="bananaSpots" fill="#81613d">${[[104,169],[160,144],[189,100],[78,147],[135,170]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="4" ry="6"/>`).join('')}</g><text id="bananaState" class="molecule-name" x="130" y="244" text-anchor="middle"></text><text class="banana-context-note" x="130" y="280" text-anchor="middle" data-t="bananaContext"></text></g>
    <g transform="${cellTransform}"><text class="scene-label" x="472" y="59" text-anchor="middle" data-t="cells"></text><path d="M318 101Q308 96 307 121L309 278Q312 305 338 307L471 307Q496 304 495 280L492 119Q488 98 468 99Z" fill="#f0f0df" stroke="#56764f" stroke-width="5"/><path d="M503 98Q496 100 500 125L505 280Q507 305 529 306L627 306Q647 305 647 280L645 122Q645 99 623 98Z" fill="#f0f0df" stroke="#56764f" stroke-width="5"/>${granules}<text class="small-label" x="474" y="346" text-anchor="middle" data-t="granules"></text></g>
    <g transform="${sugarTransform}"><rect x="698" y="85" width="340" height="258" rx="16" fill="#fff8e7" stroke="#bba66d" stroke-dasharray="7 5" stroke-width="2"/><text class="scene-label" x="869" y="48" text-anchor="middle" data-t="solubleSugars"></text><text class="small-label" x="869" y="77" text-anchor="middle" data-t="molecularView"></text>${sugars}<text class="small-label" x="869" y="374" text-anchor="middle" data-t="notMicroscope"></text></g>
    <g><rect x="${compact?30:315}" y="${compact?330:390}" width="${compact?560:720}" height="${compact?70:54}" rx="14" fill="#e6eee2" stroke="#6c8c68" stroke-width="2"/><text id="multistepLabel" x="${compact?310:675}" y="${compact?357:425}" text-anchor="middle" fill="#244f38" font-size="${compact?26:25}" font-weight="750"></text>${compact?'<path d="M310 312v15m0 77v22" stroke="#597c53" stroke-width="3" stroke-dasharray="6 5"/>':'<path d="M480 364v24m410-23v22" stroke="#597c53" stroke-width="3" stroke-dasharray="6 5"/>'}</g><text class="small-label" x="${compact?310:530}" y="${compact?925:470}" text-anchor="middle" data-t="notDataShort"></text>`;
  cache={grains:grainPositions.map((_,i)=>$(`grain${i}`)),sugars:Array.from({length:12},(_,i)=>$(`sugar${i}`))};
  applyText();
}
function bananaSnapshot(p){
  cache.grains.forEach((grain,i)=>{
    const [x,y]=grainPositions[i],persistent=i===0||i===5||i===9;
    const q=state.reduced?Math.floor(p*4)/4:p;
    const amount=clamp((q-.08-i*.028)/.65);
    const scale=persistent?mix(1,.45,amount):mix(1,0,amount);
    attr(grain,'transform',`translate(${x} ${y}) scale(${scale})`);attr(grain,'data-remaining',scale>.05);visible(grain,scale>.015);
  });
  cache.sugars.forEach((sugar,i)=>{
    const start=i<3?0:.13+(i-3)*.072;
    const amount=i<3?1:state.reduced?(p>=start?1:0):smooth((p-start)/.09);
    attr(sugar,'opacity',amount);attr(sugar,'data-visible',amount>.5);
  });
  const q=clamp(p/.84),colour=[mix(143,241,q),mix(165,201,q),mix(71,63,q)].map(Math.round);
  attr($('bananaPeel'),'fill',`rgb(${colour.join(',')})`);attr($('bananaSpots'),'opacity',clamp((p-.5)*2));
  text('bananaState',t(p<.15?'unripe':p<.88?'ripening':'ripe'));
  if(mobile){
    // Keep the long English process label within its own panel.
    $('multistepLabel').innerHTML=state.lang==='zh'?'<tspan x="310" dy="0">多種酶參與的</tspan><tspan x="310" dy="32">多步轉化</tspan>':'<tspan x="310" dy="0">Many enzymes</tspan><tspan x="310" dy="32">Multistep conversion</tspan>';
  }else text('multistepLabel',t('multistep'));
}
function applyText(){
  document.documentElement.lang=state.lang==='zh'?'zh-Hant':'en';document.title=t('title');
  document.querySelectorAll('[data-t]').forEach(el=>{const value=t(el.dataset.t);if(el.textContent!==value)el.textContent=value;});
  document.querySelectorAll('[data-aria]').forEach(el=>attr(el,'aria-label',t(el.dataset.aria)));
  attr($('zh'),'aria-pressed',state.lang==='zh');attr($('en'),'aria-pressed',state.lang==='en');
  text('fullscreenLabel',t(document.fullscreenElement?'exitFullscreen':'enterFullscreen'));
  text('diagramTitle',t(state.mode==='banana'?'diagramB':'diagramA'));text('diagramDescription',t(state.mode==='banana'?'diagramBDesc':'diagramADesc'));
}
function build(){
  if(state.mode==='banana')buildBanana();else buildHydrolysis();
  buildLegend();applyText();render();
}
function buildLegend(){
  $('legend').innerHTML=['glucose','fructose'].map(type=>`<span><svg viewBox="-36 -32 72 64" aria-hidden="true">${node(type,'')}</svg><span>${t(type)}</span></span>`).join('')+(state.mode==='banana'?`<span><svg viewBox="-60 -32 120 64" aria-hidden="true"><line x1="-25" x2="25" class="bond"/>${node('glucose','',-25,0,.75)}${node('fructose','',25,0,.75)}</svg><span>${t('sucrose')}</span></span>`:'')+`<span class="schematic">${t(state.mode==='banana'?'notMicroscope':'schematic')}</span>`;
}
function equation(p){
  if(state.mode==='banana')return;
  const r=reactions[state.reaction],revealed=p>=.40;
  const key=[state.lang,state.reaction,revealed,state.enzymeVisible].join(':');
  if(key===equationKey)return;
  equationKey=key;
  const result=state.reaction==='starch'?t('maltose'):state.reaction==='maltose'?t('twoGlucose'):t('oneEach');
  const markup=`<span>${t(state.reaction)}</span><span>＋</span><span class="reactant-water">${t('water')}</span><span class="arrow"><span>${state.enzymeVisible?t(r.enzyme):`${t('enzyme')} ?`}</span><svg viewBox="0 0 150 20" aria-hidden="true"><path d="M0 10h145m-12-8 12 8-12 8" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><span class="${revealed?'':'pending'}" data-equation-product>${revealed?result:t('unknownProduct')}</span><span class="equation-foot">${t(state.reaction==='starch'?'starchEquationNote':'equationNote')}</span>`;
  $('equation').innerHTML=markup;
}
function render(){
  const p=clamp(state.elapsed/duration()),banana=state.mode==='banana',done=p>=1;
  $('scene').classList.toggle('banana-scene',banana);
  $('projector').classList.toggle('banana-complete',banana&&done);
  $('reactionPicker').hidden=banana;$('equation').hidden=banana;$('bananaStatus').hidden=!banana;$('bananaNote').hidden=!banana;$('enzymeOption').hidden=banana;
  $('review').hidden=!(banana&&done);$('summaryText').hidden=!state.summary;
  text('showSummary',t(state.summary?'hideSummary':'showSummary'));
  attr($('modeA'),'aria-pressed',!banana);attr($('modeB'),'aria-pressed',banana);
  document.querySelectorAll('button[data-reaction]').forEach(el=>attr(el,'aria-pressed',el.dataset.reaction===state.reaction));
  $('enzymeToggle').checked=state.enzymeVisible;$('motionToggle').checked=state.reduced;
  attr($('sequence'),'aria-pressed',state.sequence);text('sequenceLabel',t(state.sequence?'stopSequence':'sequence'));text('sequenceDuration',t('sequenceTime'));
  text('playLabel',t(state.running?'pause':state.elapsed>0&&!done?'continue':done?'replay':'play'));
  const icon=state.running?'<path d="M7 4v16M17 4v16" stroke-width="4"/>':'<path d="m7 3 14 9-14 9V3Z" fill="currentColor" stroke="none"/>';
  if($('playIcon').dataset.playing!==String(state.running)){
    $('playIcon').innerHTML=icon;$('playIcon').dataset.playing=String(state.running);
  }
  $('progressFill').style.width=`${p*100}%`;attr($('progress'),'aria-valuenow',Math.round(p*100));
  text('progressLabel',state.sequence?`${t('sequenceProgress')} ${state.sequenceIndex+1} / 4`:t('manual'));
  if(banana){
    bananaSnapshot(p);text('sceneEyebrow',t('bananaEyebrow'));text('stageCaption',t(p<.15?'bananaStart':done?'bananaEnd':'bananaChanging'));text('phaseLabel',t(done?'ripe':p<.15?'unripe':'ripening'));text('ledger',t('notDataShort'));
  }else{
    const used=hydrolysisSnapshot(p);
    const phase=p<.12?0:p<.26?1:p<.40?2:p<.55?3:p<.94?4:5;
    let caption=['askEnzyme','contact','waterAction','breakAction','reuse','finished'][phase];
    if(p>=.70&&p<.82)caption='secondWater';
    text('sceneEyebrow',t(state.reaction==='starch'?'simplified':'hydrolysisExample'));
    text('stageCaption',t(caption));text('phaseLabel',`${phase+1} / 6 · ${t(['before','catalysis','waterStage','productsStage','reuseStage','complete'][phase])}`);
    text('ledger',`${t('bondsBroken')} ${used} · ${t('watersUsed')} ${used}`);equation(p);
  }
  // Stable, language-neutral state for accessibility inspection and automated checks.
  Object.assign($('lesson').dataset,{mode:state.mode,reaction:state.reaction,elapsed:state.elapsed.toFixed(3),playing:String(state.running),sequence:String(state.sequence),reduced:String(state.reduced)});
}
function cancelFrame(){if(rafId!==null)cancelAnimationFrame(rafId);rafId=null;}
function setScene(item){state.mode=item==='banana'?'banana':'hydrolysis';if(item!=='banana')state.reaction=item;state.elapsed=0;state.summary=false;state.enzymeVisible=state.mode==='hydrolysis'&&state.running;build();}
function frame(now){
  rafId=null;if(!state.running)return;
  let remaining=(now-lastNow)/1000;lastNow=now;
  while(remaining>0&&state.running){
    const step=Math.min(remaining,duration()-state.elapsed);state.elapsed+=step;remaining-=step;
    if(state.elapsed>=duration()){
      if(state.sequence&&state.sequenceIndex<3){state.sequenceIndex++;setScene(order[state.sequenceIndex]);}
      else{state.elapsed=duration();state.running=false;state.sequence=false;}
    }
  }
  render();if(state.running)rafId=requestAnimationFrame(frame);
}
function start(){
  if(state.running)return;
  if(state.elapsed>=duration()){state.elapsed=0;state.summary=false;}
  state.running=true;if(state.elapsed===0&&state.mode==='hydrolysis')state.enzymeVisible=true;
  lastNow=performance.now();cancelFrame();render();rafId=requestAnimationFrame(frame);
}
function pause(){state.running=false;cancelFrame();render();}
function select(item){pause();state.sequence=false;state.enzymeVisible=false;setScene(item);render();}
$('play').addEventListener('click',()=>state.running?pause():start());
$('replay').addEventListener('click',()=>{pause();state.sequence=false;state.elapsed=0;state.summary=false;state.enzymeVisible=false;render();start();});
$('modeA').addEventListener('click',()=>{if(state.mode!=='hydrolysis')select(state.reaction);});
$('modeB').addEventListener('click',()=>{if(state.mode!=='banana')select('banana');});
document.querySelectorAll('button[data-reaction]').forEach(el=>el.addEventListener('click',()=>select(el.dataset.reaction)));
$('sequence').addEventListener('click',()=>{
  if(state.sequence){pause();state.sequence=false;render();return;}
  pause();state.sequence=true;state.sequenceIndex=0;setScene('starch');start();
});
$('enzymeToggle').addEventListener('change',event=>{state.enzymeVisible=event.target.checked;render();});
$('motionToggle').addEventListener('change',event=>{state.reduced=event.target.checked;render();});
for(const lang of ['zh','en'])$(lang).addEventListener('click',()=>{state.lang=lang;applyText();buildLegend();render();});
$('showSummary').addEventListener('click',()=>{state.summary=!state.summary;render();});
$('fullscreen').addEventListener('click',async()=>{
  try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}
  catch{ $('statusMessage').hidden=false;text('statusMessage',t('fullscreenUnavailable')); }
});
document.addEventListener('fullscreenchange',()=>applyText());
const media=matchMedia('(max-width:639px)');media.addEventListener('change',event=>{mobile=event.matches;build();});
window.addEventListener('pagehide',cancelFrame);
build();
})();
</script>
</body>
